# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Pull Request

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: arm64
          runner: windows-11-arm
          jdk_arch: x64
    runs-on: ${{ matrix.runner }}
    # Run every step through bash (Git Bash on Windows) so ./gradlew runs the same
    # POSIX wrapper script on every OS instead of falling back to gradlew.bat.
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 26
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'zulu'
        java-version: '26'
        architecture: ${{ matrix.jdk_arch }}
    - name: Cache Gradle packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-1-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle-1-
    # The checkout may not contain the binary gradle-wrapper.jar; restore it for the
    # Gradle version pinned in gradle-wrapper.properties so ./gradlew works everywhere.
    - name: Ensure Gradle wrapper jar
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          ver=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          echo "Restoring gradle-wrapper.jar for Gradle $ver"
          ok=0
          for tag in "v$ver" "v$ver.0"; do
            if curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/$tag/gradle/wrapper/gradle-wrapper.jar"; then
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "Could not download gradle-wrapper.jar for Gradle $ver"
            exit 1
          fi
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Validity Tests Upfront
      run: ./gradlew test --tests "io.reactivex.rxjava4.validators.*" 
        --stacktrace --no-daemon
    - name: Build RxJava
      run: ./gradlew build --stacktrace

    # The publish action is a Linux container action; upload the results from every
    # leg and publish them from a Linux job below.
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()                      # important: run even if tests failed
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          **/build/test-results/**/*.xml
        if-no-files-found: ignore

    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
    - name: Generate Javadoc
      run: ./gradlew javadoc --stacktrace

